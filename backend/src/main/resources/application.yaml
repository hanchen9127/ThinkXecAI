# Secret placeholders below default to empty (${VAR:}) rather than failing here directly -
# Spring's relaxed property binding silently accepts an unresolved bare ${VAR}, so the real
# fail-fast check lives in RequiredSecretsValidator (com.thinkxecai.config), not in this file.
# The API has no authentication, so it is reachable from this machine only; HostCheckFilter also
# refuses host names other than localhost / 127.0.0.1 (DNS rebinding).
server:
  address: 127.0.0.1

spring:
  application:
    name: thinkxecai-backend

  # The Ollama starter is only here for embeddings. Its chat model can't be switched off through
  # spring.ai.model.chat without also switching off DeepSeek and Gemini, so its auto-configuration is excluded.
  autoconfigure:
    exclude: org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration

  # API messages are always English: a fixed locale makes validation messages ignore the
  # browser's Accept-Language header (otherwise a zh-CN browser gets Chinese messages).
  web:
    locale: en
    locale-resolver: fixed

  # One Markdown file per upload, at most 1 MB. The request limit stays separate (Spring's default,
  # 10 MB) so a later batch upload can send several files, each still checked against max-file-size.
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5433/thinkxecai
    username: postgres
    password: ${THINKXECAI_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  ai:
    model:
      embedding:
        # The Gemini starter also registers a text embedding model, under this key (Ollama's is
        # spring.ai.model.embedding). Turning it off leaves Ollama's bge-m3 as the only EmbeddingModel.
        text: none
    ollama:
      base-url: http://localhost:11434
      # Never pull at startup: the app starts without contacting Ollama (CI has none), and bge-m3 must already be installed.
      init:
        pull-model-strategy: never
      embedding:
        options:
          # Called through /api/embed, which returns unit-length vectors; ingestion and search must both use it.
          model: bge-m3
    deepseek:
      api-key: ${THINKXECAI_DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
    google:
      genai:
        # Gemini Developer API with an API key (not Vertex AI). The model must be set explicitly:
        # the Spring AI default, gemini-2.0-flash, has been shut down by Google.
        api-key: ${THINKXECAI_GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.8-flash

springdoc:
  # The API description (/v3/api-docs) is generated from the controllers; CI turns it into the frontend's types.
  default-produces-media-type: application/json
  # Only the JSON API is described; /health and /sse-test are plain-text diagnostics outside it.
  paths-to-match: /api/**
  # Sorted keys keep the exported document byte-for-byte stable between runs (CI diffs the generated types).
  writer-with-order-by-keys: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.thinkxecai.model
  type-handlers-package: com.thinkxecai.typehandler
  configuration:
    map-underscore-to-camel-case: true

thinkxecai:
  document:
    storage-path: ./data/documents
  # The email tool sends through the Gmail API. Everything here is optional: startup never checks it, and
  # a send with any Gmail value missing tells the model which variables are missing (values never shown).
  mail:
    gmail:
      sender: ${THINKXECAI_GMAIL_SENDER:}
      client-id: ${THINKXECAI_GMAIL_CLIENT_ID:}
      client-secret: ${THINKXECAI_GMAIL_CLIENT_SECRET:}
      refresh-token: ${THINKXECAI_GMAIL_REFRESH_TOKEN:}
      # Google's OAuth token endpoint and the Gmail API; tests point both at a local fake server.
      token-uri: https://oauth2.googleapis.com/token
      api-base-url: https://gmail.googleapis.com
    # Comma-separated addresses the tool may send to. Empty means no email is sent at all (fail-closed).
    allowed-recipients: ${THINKXECAI_MAIL_ALLOWED_RECIPIENTS:}
