# Secret placeholders below default to empty (${VAR:}) rather than failing here directly -
# Spring's relaxed property binding silently accepts an unresolved bare ${VAR}, so the real
# fail-fast check lives in RequiredSecretsValidator (com.thinkxecai.config), not in this file.
spring:
  application:
    name: thinkxecai-backend

  # API messages are always English: a fixed locale makes validation messages ignore the
  # browser's Accept-Language header (otherwise a zh-CN browser gets Chinese messages).
  web:
    locale: en
    locale-resolver: fixed

  datasource:
    url: jdbc:postgresql://localhost:5433/thinkxecai
    username: postgres
    password: ${THINKXECAI_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.qq.com
    port: 587
    username: ${THINKXECAI_MAIL_USERNAME:}
    password: ${THINKXECAI_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    deepseek:
      api-key: ${THINKXECAI_DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
    google:
      genai:
        # Gemini Developer API with an API key (not Vertex AI). The model must be set explicitly:
        # the Spring AI default, gemini-2.0-flash, has been shut down by Google.
        api-key: ${THINKXECAI_GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-3.8-flash

springdoc:
  # The API description (/v3/api-docs) is generated from the controllers; CI turns it into the frontend's types.
  default-produces-media-type: application/json
  # Only the JSON API is described; /health and /sse-test are plain-text diagnostics outside it.
  paths-to-match: /api/**
  # Sorted keys keep the exported document byte-for-byte stable between runs (CI diffs the generated types).
  writer-with-order-by-keys: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.thinkxecai.model
  type-handlers-package: com.thinkxecai.typehandler
  configuration:
    map-underscore-to-camel-case: true

thinkxecai:
  document:
    storage-path: ./data/documents
