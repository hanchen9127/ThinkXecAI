server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite puts a content hash in these names, so a new build never reuses an old file.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every route is the single-page app; index.html must not be cached, or a new build goes unseen.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
